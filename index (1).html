<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet — espace de rédaction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg: #F2F3FA;
    --sidebar: #4F46E5;
    --sidebar-icon: rgba(255,255,255,.62);
    --sidebar-icon-active-bg: rgba(255,255,255,.18);
    --card: #FFFFFF;
    --border: #E6E7F1;
    --ink: #1E2135;
    --ink-soft: #82869B;
    --accent: #4F46E5;
    --accent-dark: #4038C4;
    --accent-soft: #EEEEFC;
    --danger: #C24A4A;
    --success: #1E9E86;
    --c-cv: #4F46E5;
    --c-lettres: #DD8A2E;
    --c-notes: #1E9E86;
    --c-cr: #C2486B;
    --c-mem: #7C51D1;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131420; --sidebar: #352DAE; --card: #1B1C2A; --border: #2C2E42;
      --ink: #ECECF6; --ink-soft: #9496AC; --accent: #8B85FF; --accent-dark: #A29CFF; --accent-soft: #24234A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131420; --sidebar: #352DAE; --card: #1B1C2A; --border: #2C2E42;
    --ink: #ECECF6; --ink-soft: #9496AC; --accent: #8B85FF; --accent-dark: #A29CFF; --accent-soft: #24234A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .ui-head { font-family: 'Manrope', system-ui, sans-serif; }
  .doc-serif { font-family: 'Fraunces', Georgia, serif; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 15px; color: var(--ink); }

  /* ---------- shell ---------- */
  .shell { display: flex; min-height: 100%; }
  .sidebar {
    width: 62px; flex-shrink: 0; background: var(--sidebar); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(18px + env(safe-area-inset-top,0px)) 0 calc(14px + env(safe-area-inset-bottom,0px));
    border-radius: 0 26px 26px 0; position: sticky; top: 0;
  }
  .side-logo { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:15px; margin-bottom: 22px; flex-shrink:0; }
  .side-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .side-btn {
    width: 40px; height: 40px; border-radius: 11px; border: none; background: none;
    color: var(--sidebar-icon); display: flex; align-items: center; justify-content: center;
  }
  .side-btn svg { width: 19px; height: 19px; }
  .side-btn.active { background: var(--sidebar-icon-active-bg); color: #fff; }
  .side-btn:hover:not(.active) { color: #fff; }
  .side-foot { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }

  .main { flex: 1; min-width: 0; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 18px; }

  /* ---------- topbar (shared) ---------- */
  .topbar { padding: 22px 0 16px; }
  .topbar-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
  .page-title { font-size: 21px; font-weight: 700; margin: 0; }
  .page-sub { color: var(--ink-soft); font-size: 13px; margin-top: 3px; }
  .search-box {
    display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; min-width: 0; flex: 1; max-width: 320px;
  }
  .search-box svg { width: 15px; height: 15px; color: var(--ink-soft); flex-shrink: 0; }
  .search-box input { border: none; background: none; flex: 1; min-width: 0; font-size: 13.5px; }
  .search-box input:focus { outline: none; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink); font-size: 13.5px; font-weight: 600;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { box-shadow: 0 2px 10px rgba(30,33,53,.08); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn-quiet { border-color: transparent; background: none; color: var(--ink-soft); padding: 8px 10px; }
  .btn-quiet:hover { color: var(--ink); box-shadow: none; }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .icon-btn {
    width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9px; border: 1px solid transparent; background: none; color: var(--ink-soft);
  }
  .icon-btn:hover { border-color: var(--border); color: var(--ink); background: var(--card); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- dashboard ---------- */
  .greet { font-size: 24px; font-weight: 800; margin: 6px 0 2px; }
  .greet-sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 24px; }
  .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; margin-bottom: 34px; }
  .module-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; text-align: left; }
  .module-card:hover { box-shadow: 0 6px 20px rgba(30,33,53,.08); }
  .module-ico { width: 38px; height: 38px; border-radius: 11px; display:flex; align-items:center; justify-content:center; margin-bottom: 14px; }
  .module-ico svg { width: 18px; height: 18px; color: #fff; }
  .module-card h3 { font-size: 15px; margin: 0 0 4px; font-weight: 700; }
  .module-card p { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.4; min-height: 32px; }
  .module-count { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px; }
  .section-head h2 { font-size: 15.5px; font-weight: 700; margin: 0; }

  .doc-list { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 40px; }
  .doc-row { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-bottom: 1px solid var(--border); }
  .doc-row:last-child { border-bottom: none; }
  .doc-row-main { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .row-dot { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display:flex; align-items:center; justify-content:center; }
  .row-dot svg { width: 14px; height: 14px; color: #fff; }
  .doc-row-title { font-weight: 600; font-size: 14.5px; margin: 0 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-row-meta { font-size: 12px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; padding: 2px 8px; border: 1px solid var(--border); border-radius: 20px; font-size: 10.5px; color: var(--ink-soft); flex-shrink: 0; }
  .doc-row-actions { display: flex; gap: 2px; flex-shrink: 0; }

  .empty { border: 1px dashed var(--border); border-radius: 14px; padding: 46px 20px; text-align: center; color: var(--ink-soft); margin: 4px 0 40px; }
  .empty p { max-width: 340px; margin: 10px auto 18px; font-size: 13.5px; }

  /* ---------- editor shell ---------- */
  .builder-top { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top,0px); }
  .builder-top-row { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
  .title-input { flex: 1; min-width: 0; border: none; background: none; font-family: 'Manrope', sans-serif; font-size: 17px; font-weight: 700; color: var(--ink); padding: 4px 0; border-bottom: 1px solid transparent; }
  .title-input:focus { outline: none; border-bottom-color: var(--accent); }
  .save-status { font-size: 11.5px; color: var(--ink-soft); flex-shrink: 0; white-space: nowrap; }
  .variant-row { display: flex; gap: 6px; padding-bottom: 10px; overflow-x: auto; }
  .variant-pill { border: 1px solid var(--border); background: var(--card); padding: 6px 13px; border-radius: 20px; font-size: 12px; color: var(--ink-soft); flex-shrink: 0; white-space: nowrap; }
  .variant-pill.active { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }
  .section-rail { width: 172px; flex-shrink: 0; padding: 18px 12px 40px 0; position: sticky; top: 122px; align-self: flex-start; }
  .rail-item { display: block; width: 100%; text-align: left; padding: 9px 11px; border-radius: 9px; border: none; background: none; color: var(--ink-soft); font-size: 13px; margin-bottom: 2px; }
  .rail-item.active { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: inset 2px 0 0 var(--accent); }
  .rail-item:hover:not(.active) { color: var(--ink); }
  .section-mobile-tabs { display: none; overflow-x: auto; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .section-mobile-tabs .rail-item { width: auto; flex-shrink: 0; white-space: nowrap; box-shadow: none; border-bottom: 2px solid transparent; border-radius: 0; }
  .section-mobile-tabs .rail-item.active { border-bottom-color: var(--accent); }
  .builder-body { display: flex; gap: 4px; align-items: flex-start; }
  .form-pane { flex: 1; min-width: 0; padding: 20px 0 60px; max-width: 560px; }
  .preview-pane { width: 400px; flex-shrink: 0; padding: 18px 0 60px 22px; position: sticky; top: 122px; }

  .field { margin-bottom: 19px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  .field input[type=text], .field input[type=email], .field input[type=tel], .field input[type=date], .field textarea, .field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--card); color: var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 68px; line-height: 1.5; font-size: 14px; }
  .field-row { display: flex; gap: 14px; }
  .field-row .field { flex: 1; min-width: 0; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .section-desc { font-size: 13px; color: var(--ink-soft); margin: 0 0 18px; }

  .repeat-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px 16px 4px; margin-bottom: 14px; background: var(--card); }
  .repeat-card-head { display: flex; justify-content: space-between; align-items: center; margin: -2px 0 8px; }
  .repeat-card-head .mini-actions { display: flex; gap: 2px; }
  .add-row-btn { width: 100%; border: 1px dashed var(--border); border-radius: 10px; padding: 12px; background: none; color: var(--ink-soft); font-size: 13.5px; text-align: center; font-weight: 600; }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent-dark); }

  .chip-input-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 20px; padding: 6px 6px 6px 13px; font-size: 13px; background: var(--card); }
  .chip button { border: none; background: none; color: var(--ink-soft); width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .chip button:hover { background: var(--border); color: var(--ink); }
  .chip-add { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 20px; padding: 6px 6px 6px 13px; min-width: 160px; flex: 1; background: var(--card); }
  .chip-add input { border: none; flex: 1; background: none; padding: 4px 0; }
  .chip-add input:focus { outline: none; }

  /* ---------- preview sheet ---------- */
  .sheet { background: #ffffff; color: #16213a; width: 100%; max-height: 68vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; font-size: 9.5px; line-height: 1.45; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 12px; }
  .sheet-actions .btn { flex: 1; justify-content: center; }

  .cv-doc { padding: 26px 24px; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #182238; }
  .cv-doc h1.cv-name { font-family: 'Fraunces', Georgia, serif; font-size: 21px; margin: 0 0 2px; font-weight: 600; }
  .cv-doc .cv-role { font-size: 11px; color: #B8842E; margin: 0 0 12px; font-weight: 500; }
  .cv-doc .cv-contact { font-size: 9px; color: #4a5468; display: flex; flex-wrap: wrap; gap: 3px 10px; margin-bottom: 14px; }
  .cv-doc h2.cv-h2 { font-family: 'Fraunces', Georgia, serif; font-size: 11.5px; font-weight: 600; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #DAD3C1; color: #1E2A44; }
  .cv-doc .cv-item { margin-bottom: 9px; }
  .cv-doc .cv-item-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 10px; }
  .cv-doc .cv-item-sub { font-size: 9.3px; color: #4a5468; margin: 1px 0 3px; font-style: italic; }
  .cv-doc .cv-item-desc { font-size: 9.3px; color: #232f48; white-space: pre-line; }
  .cv-doc .cv-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .cv-doc .cv-tag { border: 1px solid #DAD3C1; border-radius: 20px; padding: 2px 8px; font-size: 8.8px; }
  .cv-doc .cv-profil { font-size: 9.6px; margin-bottom: 4px; white-space: pre-line; }
  .cv-doc ol { margin: 0 0 4px; padding-left: 16px; font-size: 9.3px; }
  .cv-doc ol li { margin-bottom: 3px; }

  .cv-doc.tpl-moderne { display: flex; padding: 0; }
  .tpl-moderne .cv-side { width: 34%; background: #1E2A44; color: #F6F3EB; padding: 24px 16px; }
  .tpl-moderne .cv-side h1.cv-name { color: #fff; font-size: 18px; }
  .tpl-moderne .cv-side .cv-role { color: #D9A54B; }
  .tpl-moderne .cv-side .cv-contact { flex-direction: column; color: #C9C2AF; gap: 5px; }
  .tpl-moderne .cv-side h2.cv-h2 { color: #F1E4C8; border-bottom-color: rgba(255,255,255,.25); font-size: 10.5px; }
  .tpl-moderne .cv-side .cv-tag { border-color: rgba(255,255,255,.35); color: #F1E4C8; }
  .tpl-moderne .cv-main { width: 66%; padding: 24px 20px; }
  .tpl-sobre .cv-role { color: #4a5468; }
  .tpl-sobre h2.cv-h2 { border-bottom: none; text-transform: uppercase; letter-spacing: .5px; font-size: 10px; }

  /* lettre */
  .tpl-lettre { padding: 30px 28px; }
  .lettre-header { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
  .lettre-exp { font-size: 9.3px; line-height: 1.6; white-space: pre-line; max-width: 46%; }
  .lettre-destdate { text-align: right; max-width: 50%; }
  .lettre-dest { font-size: 9.3px; line-height: 1.6; white-space: pre-line; margin-bottom: 10px; }
  .lettre-lieu-date { font-size: 9.3px; color: #4a5468; }
  .lettre-objet { font-size: 9.8px; margin-bottom: 16px; }
  .lettre-corps { font-size: 9.6px; line-height: 1.7; white-space: pre-line; margin-bottom: 20px; }
  .lettre-formule { font-size: 9.6px; line-height: 1.6; white-space: pre-line; margin-bottom: 30px; }
  .lettre-signature { font-size: 9.8px; font-weight: 600; text-align: right; }

  /* mémoire */
  .mem-cover { min-height: 46vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 24px; border-bottom: 1px dashed #DAD3C1; }
  .mem-etab { font-size: 9.5px; text-transform: uppercase; letter-spacing: .6px; color: #4a5468; }
  .mem-filiere { font-size: 9px; color: #4a5468; margin-top: 2px; }
  .mem-kind { font-size: 10px; letter-spacing: 2px; color: #B8842E; margin: 22px 0 10px; font-weight: 600; }
  .mem-title { font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600; max-width: 320px; margin: 0 auto; }
  .mem-auteur { font-size: 10px; margin-top: 22px; font-weight: 600; }
  .mem-encadreur { font-size: 9.3px; color: #4a5468; margin-top: 4px; }
  .mem-annee { font-size: 9px; color: #4a5468; margin-top: 14px; }
  .mem-block { padding: 22px 24px; border-bottom: 1px dashed #DAD3C1; }
  .mem-block h2.cv-h2 { margin-top: 0; }
  .mem-part { padding: 4px 24px 18px; }

  /* ---------- full-screen mobile preview ---------- */
  .preview-modal { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: none; flex-direction: column; }
  .preview-modal.open { display: flex; }
  .preview-modal-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; padding-top: calc(14px + env(safe-area-inset-top,0px)); border-bottom: 1px solid var(--border); }
  .preview-modal-body { flex: 1; overflow: auto; padding: 18px; }
  .preview-modal .sheet { max-width: 460px; margin: 0 auto; max-height: none; }
  .fab-preview { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom,0px)); z-index: 40; border-radius: 30px; padding: 13px 20px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .credits-pill { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom,0px)); left: 74px; z-index: 41; background: var(--card); color: var(--ink); border: 1px solid var(--border); border-radius: 20px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .credits-pill svg { width: 14px; height: 14px; }
  .credits-pill.low { color: var(--danger); border-color: var(--danger); }
  @media (max-width: 900px) { .credits-pill { left: 66px; } }

  .util-row { display: flex; gap: 10px; padding: 4px 0 50px; flex-wrap: wrap; }

  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 13.5px; transition: all .25s ease; pointer-events: none; z-index: 200; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    .preview-pane { display: none; } .section-rail { display: none; } .section-mobile-tabs { display: flex; }
    .builder-body { display: block; } .form-pane { max-width: none; padding-bottom: 90px; }
    .sidebar { border-radius: 0 20px 20px 0; width: 54px; }
  }
  @media (min-width: 901px) { .fab-preview { display: none; } }

  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; }
    .cv-doc { padding: 0; }
    .mem-part { page-break-before: always; }
    .mem-cover { page-break-after: always; min-height: 0; }
    @page { margin: 14mm; }
  }

  #splashScreen { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; background: var(--bg); transition: opacity .45s ease; }
  #splashScreen.hide { opacity: 0; pointer-events: none; }
  .splash-card { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(340px, 88vw); text-align: center; }
  .splash-logo { width: 64px; height: 64px; border-radius: 18px; background: var(--sidebar-icon-active-bg, #4f46e5); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 700; font-size: 28px; animation: splashPop .6s cubic-bezier(.34,1.56,.64,1) both, splashPulse 2.4s ease-in-out 1.1s infinite; box-shadow: 0 10px 28px rgba(79,70,229,.35); }
  .splash-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; opacity: 0; animation: splashFadeUp .5s ease .25s forwards; }
  .splash-tagline { font-size: 13px; color: var(--ink-soft); opacity: 0; animation: splashFadeUp .5s ease .4s forwards; }
  .splash-dots { display: flex; gap: 6px; margin-top: 6px; opacity: 0; animation: splashFadeUp .5s ease .55s forwards; }
  .splash-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--sidebar-icon-active-bg, #4f46e5); animation: splashDot 1.1s ease-in-out infinite; }

/* ---------------- storage ---------------- */
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      store = Object.assign({ cv: [], lettres: [], notes: [], cr: [], mem: [] }, parsed);
      return;
    }
    const old = localStorage.getItem(OLD_CV_KEY);
    if (old) {
      const list = JSON.parse(old);
      if (Array.isArray(list)) store.cv = list;
      persistStore();
    }
  } catch (e) { /* start fresh */ }
}
function persistStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); return true; }
  catch (e) { showToast("Échec de l'enregistrement (mémoire du navigateur pleine ?)"); return false; }
}
function genId() { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---------------- helpers ---------------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }); }
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function excerpt(s, n) { s = (s||'').trim().replace(/\s+/g,' '); return s.length > n ? s.slice(0,n) + '…' : s; }

/* ---------------- theme ---------------- */
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
}
function isDark() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) return saved === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  document.documentElement.setAttribute('data-theme', next);
  render();
}

/* =========================================================

   ========================================================= */
function persistActiveDoc() {
  if (!state.doc) return;
  state.doc.updatedAt = Date.now();
  const arr = store[state.module];
  const idx = arr.findIndex(d => d.id === state.doc.id);
  if (idx >= 0) arr[idx] = state.doc; else arr.unshift(state.doc);
  persistStore();
}
function debounceSave() {
  clearTimeout(state.saveTimer);
  state.savedLabel = 'Enregistrement…'; updateSaveStatus();
  state.saveTimer = setTimeout(() => {
    persistActiveDoc();
    state.savedLabel = 'Enregistré ' + new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    updateSaveStatus();
  }, 500);
}
function updateSaveStatus() { const el = document.getElementById('saveStatus'); if (el) el.textContent = state.savedLabel; }

function goDashboard() {
  clearTimeout(state.saveTimer); if (state.doc) persistActiveDoc();
  state.module = 'dashboard'; state.screen = 'list'; state.doc = null; state.query=''; render();
}
function goModule(key) {
  clearTimeout(state.saveTimer); if (state.doc) persistActiveDoc();
  state.module = key; state.screen = 'list'; state.doc = null; state.query=''; render();
}
function openDoc(key, id) {
  const arr = store[key]; const found = arr.find(d => d.id === id); if (!found) return;
  state.doc = Object.assign(MODULES[key].blank(), found);
  state.module = key; state.screen = 'edit'; state.section = MODULES[key].sections[0].key;
  state.savedLabel = 'Enregistré ' + new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  render();
}
function createDoc(key) {
  const doc = MODULES[key].blank();
  store[key].unshift(doc); persistStore(); openDoc(key, doc.id);
}
function duplicateDoc(key, id, ev) {
  ev && ev.stopPropagation();
  const src = store[key].find(d => d.id === id); if (!src) return;
  const copy = JSON.parse(JSON.stringify(src)); copy.id = genId(); copy.titre = src.titre + ' (copie)'; copy.updatedAt = Date.now();
  store[key].unshift(copy); persistStore(); renderModuleListRows(key);
  showToast('Dupliqué');
}
function deleteDoc(key, id, ev) {
  ev && ev.stopPropagation();
  if (!confirm('Supprimer définitivement ce document ? Cette action est irréversible.')) return;
  store[key] = store[key].filter(d => d.id !== id); persistStore(); renderModuleListRows(key);
  showToast('Supprimé');
}

function setTitre(val) { state.doc.titre = val; debounceSave(); }
function setField(field, val) { state.doc[field] = val; debounceSave(); syncPreview(); }
function setVariant(val) {
  state.doc.template = val;
  if (state.module === 'lettres') {
    const defaults = { motivation:'Candidature au poste de …', demission:'Lettre de démission', reclamation:'Réclamation concernant …', libre:'' };
    if (!state.doc.objet || Object.values(defaults).includes(state.doc.objet)) state.doc.objet = defaults[val] || '';
  }
  debounceSave(); renderEditor();
}
function addItem(key, defaults) { state.doc[key].push(Object.assign({ id: genId() }, defaults)); debounceSave(); renderEditor(); }
function removeItem(key, id) { state.doc[key] = state.doc[key].filter(i => i.id !== id); debounceSave(); renderEditor(); }
function setItemField(key, id, field, val) { const it = state.doc[key].find(i => i.id === id); if (it) it[field] = val; debounceSave(); syncPreview(); }
function moveItem(key, id, dir) {
  const arr = state.doc[key]; const idx = arr.findIndex(i => i.id === id); const j = idx + dir;
  if (idx < 0 || j < 0 || j >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp; debounceSave(); renderEditor();
}

function removeChip(key, id) { state.doc[key] = state.doc[key].filter(i => i.id !== id); debounceSave(); renderEditor(); }

/* ---------------- IA : fichiers et images joints ---------------- */
let aiFiles = [];
const AI_MAX_FILES = 3, AI_MAX_BYTES = 5 * 1024 * 1024;
function fileToDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('read')); r.readAsDataURL(file); });
}
function fileToText(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('read')); r.readAsText(file); });
}
function compressImage(dataUrl, maxSide) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => rej(new Error('img'));
    img.src = dataUrl;
  });
}
async function handleAiFiles(fileList) {
  const files = Array.from(fileList || []);
  for (const f of files) {
    if (aiFiles.length >= AI_MAX_FILES) { showToast('Maximum ' + AI_MAX_FILES + ' fichiers'); break; }
    try {
      if (f.type.startsWith('image/')) {
        const url = await compressImage(await fileToDataURL(f), 1600);
        aiFiles.push({ name: f.name, kind: 'image', mediaType: 'image/jpeg', data: url.split(',')[1], preview: url });
      } else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
        if (f.size > AI_MAX_BYTES) { showToast(f.name + ' dépasse 5 Mo'); continue; }
        const url = await fileToDataURL(f);
        aiFiles.push({ name: f.name, kind: 'pdf', mediaType: 'application/pdf', data: url.split(',')[1] });
      } else if (f.type.startsWith('text/') || /\.(txt|md)$/i.test(f.name)) {
        if (f.size > AI_MAX_BYTES) { showToast(f.name + ' dépasse 5 Mo'); continue; }
        aiFiles.push({ name: f.name, kind: 'text', data: (await fileToText(f)).slice(0, 30000) });
      } else {
        showToast(f.name + ' : format non pris en charge (images, PDF, .txt)');
      }
    } catch (e) { showToast('Impossible de lire ' + f.name); }
  }
  document.getElementById('aiFileInput').value = '';
  renderAiFiles();
}
function removeAiFile(i) { aiFiles.splice(i, 1); renderAiFiles(); }
function renderAiFiles() {
  const el = document.getElementById('aiFileList'); if (!el) return;
  el.innerHTML = aiFiles.map((f, i) => `
    <span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:5px 8px;font-size:12px;max-width:100%;">
      ${f.kind === 'image' ? `<img src="${f.preview}" alt="" style="width:26px;height:26px;object-fit:cover;border-radius:5px;">` : (f.kind === 'pdf' ? '📄' : '📝')}
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;">${esc(f.name)}</span>
      <button type="button" onclick="removeAiFile(${i})" style="border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:15px;line-height:1;padding:0 2px;" aria-label="Retirer">×</button>

}

function toChips(arr) { return (arr||[]).filter(Boolean).map(t => ({ id: genId(), texte: String(t) })); }
function withIds(arr) { return (arr||[]).map(o => Object.assign({ id: genId() }, o)); }
async function runAiGenerate() {
  if (!gateAi()) { closeAiModal(); return; }
  const key = state.module; const schema = AI_SCHEMAS[key]; if (!schema) return;
  const input = document.getElementById('aiInput').value.trim();
  if (!input && !aiFiles.length) { showToast("Décris ta situation ou joins un fichier"); return; }
  const btn = document.getElementById('aiGenBtn'); const inp = document.getElementById('aiInput');
  btn.disabled = true; inp.disabled = true; btn.textContent = 'Génération…';
  const userContent = [];
  aiFiles.forEach(f => {
    if (f.kind === 'image') userContent.push({ type: 'image', source: { type: 'base64', media_type: f.mediaType, data: f.data } });
    else if (f.kind === 'pdf') userContent.push({ type: 'document', source: { type: 'base64', media_type: f.mediaType, data: f.data } });
    else userContent.push({ type: 'text', text: 'Contenu du fichier « ' + f.name + ' » :\n' + f.data });
  });
  userContent.push({ type: 'text', text: input || "Génère le document à partir du ou des fichiers joints." });
  const sys = schema.system + (aiFiles.length ? "\n\nL'utilisateur joint un ou plusieurs fichiers ou images. Sers-t'en comme modèle (structure, rubriques, ton, style) et/ou comme source d'informations pour remplir le document, sans copier mot pour mot. Réponds toujours uniquement avec le JSON demandé." : "");
  try {
    const data = await callAi(sys, [{ role: "user", content: userContent }]);
    const raw = (data.content || []).map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    applyAiResult(key, parsed);
    closeAiModal();
    renderEditor();
    showToast('Document généré ✨ — relis avant de l\'utiliser');
  } catch (e) {
    showToast("La génération a échoué. Réessaie dans un instant.");
  }
  btn.disabled = false; inp.disabled = false; btn.textContent = 'Générer';
}
function applyAiResult(key, data) {
  const doc = state.doc;
  if (key === 'cv') {
    if (data.identite) Object.assign(doc.identite, data.identite);
    if (data.profil) doc.profil = data.profil;
    if (data.formations) doc.formations = withIds(data.formations);
    if (data.experiences) doc.experiences = withIds(data.experiences);
    if (data.competences) doc.competences = toChips(data.competences);
    if (data.langues) doc.langues = withIds(data.langues);
    if (data.interets) doc.interets = toChips(data.interets);
  } else if (key === 'lettres') {
    ['destinataire','objet','corps','formule','signature'].forEach(f => { if (data[f]) doc[f] = data[f]; });
  } else if (key === 'notes') {
    if (data.titre) doc.titre = data.titre;
    if (data.contenu) doc.contenu = data.contenu;
  } else if (key === 'cr') {
    ['date','lieu','prochaineReunion'].forEach(f => { if (data[f]) doc[f] = data[f]; });
    if (data.participants) doc.participants = toChips(data.participants);
    if (data.ordreDuJour) doc.ordreDuJour = toChips(data.ordreDuJour);
    if (data.points) doc.points = withIds(data.points);
    if (data.actions) doc.actions = withIds(data.actions);
  } else if (key === 'mem') {
    if (data.titre) doc.titre = data.titre;
    if (data.filiere) doc.filiere = data.filiere;
    if (data.resume) doc.resume = data.resume;
    if (data.motsCles) doc.motsCles = toChips(data.motsCles);
    if (data.parties) doc.parties = withIds(data.parties);
  }
  debounceSave();
}

      <p class="page-sub">Recherches, questions de cours, méthodologie, idées… n'importe quel sujet, pas seulement tes documents.</p>
    </div>
    <div id="chatLog" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;max-width:640px;"></div>
    <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:60px;max-width:640px;">
      <textarea id="chatInput" rows="2" placeholder="Écris ta question…" style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--ink);resize:vertical;" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
      <button class="btn btn-primary" id="chatSendBtn" onclick="sendChat()">Envoyer</button>
    </div>`;
  renderChatLog();
}
function renderChatLog() {
  const log = document.getElementById('chatLog'); if (!log) return;
  if (assistantMessages.length === 0) {
    log.innerHTML = `<div class="empty"><p>Demande-moi une recherche, une explication de cours, un plan, une reformulation… ce que tu veux.</p></div>`;
    return;
  }
  log.innerHTML = assistantMessages.map(m => `
    <div style="align-self:${m.role==='user'?'flex-end':'flex-start'};max-width:85%;background:${m.role==='user'?'var(--accent)':'var(--card)'};color:${m.role==='user'?'#fff':'var(--ink)'};border:1px solid ${m.role==='user'?'transparent':'var(--border)'};border-radius:14px;padding:10px 14px;font-size:13.5px;white-space:pre-wrap;line-height:1.5;">${esc(m.content)}</div>
  `).join('');
  log.scrollTop = log.scrollHeight;
}
async function sendChat() {
  const inp = document.getElementById('chatInput'); const text = inp.value.trim();
  if (!text) return;
  if (!gateAi()) return;
  assistantMessages.push({ role: 'user', content: text }); inp.value = ''; renderChatLog(); saveAssistantHistory();
  const btn = document.getElementById('chatSendBtn'); btn.disabled = true; btn.textContent = '…';
  try {
    const data = await callAi("Tu es l'assistant de recherche du Carnet, une app pour étudiant(e)s togolais(es). Tu aides sur n'importe quel sujet — cours, recherches, méthodologie, actualité, idées — pas seulement les CV, lettres ou mémoires. Réponds en français, de façon claire et concise.", assistantMessages.map(m => ({ role: m.role, content: m.content })));
    const reply = (data.content || []).map(b => b.text || '').join('') || "Désolé, je n'ai pas pu répondre.";
    assistantMessages.push({ role: 'assistant', content: reply });
  } catch (e) {
    if (e.message !== 'no_credits' && e.message !== 'auth') assistantMessages.push({ role: 'assistant', content: "Une erreur est survenue. Vérifie ta connexion et réessaie." });
  }
  renderChatLog(); saveAssistantHistory();
  btn.disabled = false; btn.textContent = 'Envoyer';
}

function lettrePlaceholder(type) {
  const map = {

    reclamation: "Madame, Monsieur,\n\nJe me permets de vous contacter au sujet de […].\n\n[Exposez les faits avec précision : dates, éléments concernés]\n\nJe vous remercie de l'attention que vous porterez à ma demande et reste dans l'attente d'un retour de votre part.",

  </div>`;
}

/* =========================================================
   MÉMOIRES MODULE
   ========================================================= */
function renderMemSection(doc, key) {
  if (key === 'garde') return `
    <p class="section-title">Page de garde</p>
    <div class="field"><label>Établissement</label><input type="text" placeholder="Ex. École Normale Supérieure d'Atakpamé" value="${esc(doc.etablissement)}" oninput="setField('etablissement', this.value)"></div>
    <div class="field"><label>Filière / mention</label><input type="text" placeholder="Ex. Licence Professionnelle d'Enseignement — SVT" value="${esc(doc.filiere)}" oninput="setField('filiere', this.value)"></div>
    <div class="field"><label>Auteur</label><input type="text" value="${esc(doc.auteur)}" oninput="setField('auteur', this.value)"></div>
    <div class="field"><label>Encadreur / directeur de mémoire</label><input type="text" value="${esc(doc.encadreur)}" oninput="setField('encadreur', this.value)"></div>
    <div class="field"><label>Année académique</label><input type="text" placeholder="Ex. 2025 – 2026" value="${esc(doc.anneeAcademique)}" oninput="setField('anneeAcademique', this.value)"></div>`;
  if (key === 'avant') return `
    <p class="section-title">Avant-propos</p><p class="section-desc">Facultatif — laisse vide ce que tu n'utilises pas.</p>
    <div class="field"><label>Dédicace</label><textarea rows="3" oninput="setField('dedicace', this.value)">${esc(doc.dedicace)}</textarea></div>
    <div class="field"><label>Remerciements</label><textarea rows="4" oninput="setField('remerciements', this.value)">${esc(doc.remerciements)}</textarea></div>
    <div class="field"><label>Résumé</label><textarea rows="5" oninput="setField('resume', this.value)">${esc(doc.resume)}</textarea></div>
    <div class="field"><label>Mots-clés</label>
      <div class="chip-input-wrap">${doc.motsCles.map(c => `<span class="chip">${esc(c.texte)}<button onclick="removeChip('motsCles','${c.id}')">${ICON.x}</button></span>`).join('')}
        <span class="chip-add"><input type="text" placeholder="Ajouter…" onkeydown="if(event.key==='Enter'){event.preventDefault(); addChip('motsCles', this.value, this);}"></span></div>
    </div>`;
  if (key === 'parties') return `
    <p class="section-title">Chapitres</p><p class="section-desc">Ajoute tes parties dans l'ordre ; utilise les flèches pour réorganiser.</p>
    ${doc.parties.map((p,idx) => `
      <div class="repeat-card">
        <div class="repeat-card-head">
          <span style="font-size:11px;color:var(--ink-soft);font-weight:700;">Chapitre ${idx+1}</span>
          <div class="mini-actions">
            <button class="icon-btn" title="Monter" onclick="moveItem('parties','${p.id}',-1)">${ICON.up}</button>
            <button class="icon-btn" title="Descendre" onclick="moveItem('parties','${p.id}',1)">${ICON.down}</button>
            <button class="icon-btn" title="Supprimer" onclick="removeItem('parties','${p.id}')">${ICON.trash}</button>
          </div>
        </div>
        <div class="field"><label>Titre du chapitre</label><input type="text" placeholder="Ex. Cadre théorique" value="${esc(p.titre)}" oninput="setItemField('parties','${p.id}','titre',this.value)"></div>
        <div class="field"><label>Contenu</label><textarea rows="8" oninput="setItemField('parties','${p.id}','contenu',this.value)">${esc(p.contenu)}</textarea></div>
      </div>`).join('')}
    <button class="add-row-btn" onclick="addItem('parties', {titre:'',contenu:''})">${ICON.plus} Ajouter un chapitre</button>`;
  return '';
}
function buildMemHtml(doc) {
  const parts = doc.parties || [];
  return `<div class="cv-doc">
    <div class="mem-cover">
      ${doc.etablissement ? `<div class="mem-etab">${esc(doc.etablissement)}</div>` : ''}
      ${doc.filiere ? `<div class="mem-filiere">${esc(doc.filiere)}</div>` : ''}
      <div class="mem-kind">MÉMOIRE</div>
      <h1 class="mem-title">${esc(doc.titre || 'Titre du mémoire')}</h1>
      ${doc.auteur ? `<div class="mem-auteur">Présenté par ${esc(doc.auteur)}</div>` : ''}
      ${doc.encadreur ? `<div class="mem-encadreur">Sous la direction de ${esc(doc.encadreur)}</div>` : ''}
      ${doc.anneeAcademique ? `<div class="mem-annee">Année académique ${esc(doc.anneeAcademique)}</div>` : ''}
    </div>
    ${doc.dedicace ? `<div class="mem-block"><h2 class="cv-h2">Dédicace</h2><div class="cv-item-desc">${esc(doc.dedicace)}</div></div>` : ''}
    ${doc.remerciements ? `<div class="mem-block"><h2 class="cv-h2">Remerciements</h2><div class="cv-item-desc">${esc(doc.remerciements)}</div></div>` : ''}
    ${doc.resume ? `<div class="mem-block"><h2 class="cv-h2">Résumé</h2><div class="cv-item-desc">${esc(doc.resume)}</div>${doc.motsCles.length?`<div class="cv-tags" style="margin-top:8px;">${doc.motsCles.map(m=>`<span class="cv-tag">${esc(m.texte)}</span>`).join('')}</div>`:''}</div>` : ''}
    ${parts.length ? `<div class="mem-block"><h2 class="cv-h2">Table des matières</h2><ol>${parts.map((p,i)=>`<li>${esc(p.titre || 'Chapitre '+(i+1))}</li>`).join('')}</ol></div>` : ''}
    ${parts.map((p,i) => `<div class="mem-part"><h2 class="cv-h2">${i+1}. ${esc(p.titre || 'Chapitre '+(i+1))}</h2><div class="cv-item-desc">${p.contenu ? esc(p.contenu) : '<span class="cv-item-sub">Contenu à venir.</span>'}</div></div>`).join('')}
  </div>`;
}

/* =========================================================
   EXPORT (print / standalone HTML / backup)
   ========================================================= */
function printDoc() {
  document.getElementById('printArea').innerHTML = MODULES[state.module].buildPreview(state.doc);
  setTimeout(() => window.print(), 60);
}
function standaloneDoc() {
  const styleTag = document.querySelector('style').outerHTML;
  const fontsLink = Array.from(document.querySelectorAll('link[rel=stylesheet], link[rel=preconnect]')).map(l => l.outerHTML).join('\n');
  const titre = state.doc.titre || 'Document';
  return `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>${esc(titre)}</title>
${fontsLink}${styleTag}
<style>body{background:#fff;padding:24px;} .cv-doc{max-width:720px;margin:0 auto;box-shadow:0 0 0 1px #DAD3C1;}</style>
</head><body>${MODULES[state.module].buildPreview(state.doc)}</body></html>`;
}
function downloadStandalone() {
  const html = standaloneDoc();
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const name = (state.doc.titre || 'document').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'document';
  a.href = url; a.download = `${name}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast('Fichier téléchargé');
}

function openBackupMenu() {
  const total = MODULE_KEYS.reduce((n,k) => n + (store[k]||[]).length, 0);
  if (!confirm(`Exporter tous tes documents (${total}) dans un fichier de sauvegarde ?\n\nClique sur Annuler si tu veux plutôt importer une sauvegarde existante.`)) {
    importBackupPrompt();
    return;
  }
  exportBackup();
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'carnet-sauvegarde.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast('Sauvegarde téléchargée');
}
function importBackupPrompt() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.onchange = (ev) => {
    const file = ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        let added = 0;
        MODULE_KEYS.forEach(k => {
          if (!Array.isArray(imported[k])) return;
          const existingIds = new Set((store[k]||[]).map(d => d.id));
          imported[k].forEach(d => { if (d && d.id && !existingIds.has(d.id)) { store[k].push(d); added++; } });
        });
        persistStore(); render();
        showToast(added + ' document(s) importé(s)');
      } catch (e) { showToast('Fichier de sauvegarde invalide'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
